name: clang-tidy

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clang-tidy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-loader:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Analyze the first-party native loader
        shell: pwsh
        run: |
          clang-tidy --version
          msbuild Compatibility-Module/Application/EfiDSEFix/src/EfiDSEFix.vcxproj `
            /m /t:ClCompile /p:Configuration=Release /p:Platform=x64 `
            /p:EnableClangTidyCodeAnalysis=true /p:ClangTidyMaxProcesses=0
